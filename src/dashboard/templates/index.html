{% extends "base.html" %}

{% block title %}Files - Media Dashboard{% endblock %}

{% block content %}
<div class="mb-4 flex justify-between items-center">
    <h2 class="text-lg font-semibold">Downloads</h2>
    <button
        hx-get="/partials/files"
        hx-target="#file-list"
        hx-swap="innerHTML"
        class="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-sm"
    >
        Refresh
    </button>
</div>

<div id="file-list" class="space-y-2">
    {% for item in items %}
    <div class="bg-gray-800 rounded-lg p-3 flex justify-between items-center">
        <div class="flex-1 min-w-0 mr-4">
            <div class="flex items-center gap-2">
                {% if item.is_dir %}
                <svg class="w-5 h-5 text-yellow-500 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/>
                </svg>
                {% else %}
                <svg class="w-5 h-5 text-blue-500 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" clip-rule="evenodd"/>
                </svg>
                {% endif %}
                <span class="truncate">{{ item.name }}</span>
            </div>
            <div class="text-xs text-gray-500 ml-7">{{ item.size_human }}</div>
        </div>
        <button
            onclick="openMoveModal('{{ item.path }}', '{{ item.name }}')"
            class="bg-green-600 hover:bg-green-500 px-3 py-2 rounded text-sm font-medium"
        >
            Move
        </button>
    </div>
    {% else %}
    <div class="text-center py-8 text-gray-500">
        No files in downloads
    </div>
    {% endfor %}
</div>

<!-- Move Modal -->
<div id="move-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-gray-800 rounded-lg p-6 w-full max-w-md">
        <h3 class="text-lg font-semibold mb-4">Move to Library</h3>
        <form id="move-form" hx-post="/api/move" hx-swap="none">
            <input type="hidden" name="path" id="move-path">

            <div class="mb-4">
                <label class="block text-sm text-gray-400 mb-1">Name</label>
                <input
                    type="text"
                    name="new_name"
                    id="move-name"
                    class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white"
                >
            </div>

            <div class="mb-6">
                <label class="block text-sm text-gray-400 mb-2">Destination</label>
                <div class="flex gap-4">
                    <label class="flex-1">
                        <input type="radio" name="destination" value="movies" checked class="sr-only peer">
                        <div class="bg-gray-700 peer-checked:bg-blue-600 peer-checked:border-blue-500 border border-gray-600 rounded-lg p-3 text-center cursor-pointer hover:bg-gray-600">
                            Movies
                        </div>
                    </label>
                    <label class="flex-1">
                        <input type="radio" name="destination" value="shows" class="sr-only peer">
                        <div class="bg-gray-700 peer-checked:bg-blue-600 peer-checked:border-blue-500 border border-gray-600 rounded-lg p-3 text-center cursor-pointer hover:bg-gray-600">
                            Shows
                        </div>
                    </label>
                </div>
            </div>

            <div class="flex gap-3">
                <button
                    type="button"
                    onclick="closeMoveModal()"
                    class="flex-1 bg-gray-700 hover:bg-gray-600 py-2 rounded"
                >
                    Cancel
                </button>
                <button
                    type="submit"
                    class="flex-1 bg-green-600 hover:bg-green-500 py-2 rounded font-medium"
                >
                    Move
                </button>
            </div>
        </form>
    </div>
</div>

<script>
function openMoveModal(path, name) {
    document.getElementById('move-path').value = path;
    document.getElementById('move-name').value = name;
    document.getElementById('move-modal').classList.remove('hidden');
    document.getElementById('move-modal').classList.add('flex');
}

function closeMoveModal() {
    document.getElementById('move-modal').classList.add('hidden');
    document.getElementById('move-modal').classList.remove('flex');
}

// Close on backdrop click
document.getElementById('move-modal').addEventListener('click', function(e) {
    if (e.target === this) closeMoveModal();
});

// Handle form success
document.body.addEventListener('htmx:afterRequest', function(e) {
    if (e.detail.elt.id === 'move-form' && e.detail.successful) {
        closeMoveModal();
        htmx.ajax('GET', '/partials/files', {target: '#file-list', swap: 'innerHTML'});
    }
});
</script>
{% endblock %}
