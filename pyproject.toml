[project]
name = "media-server"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15.0,<4",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "py-rutracker-client>=0.1.0",
    "python-multipart>=0.0.12",
    "requests>=2.32.0",
    "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/services", "src/dashboard", "src/bot"]
