{% for item in items %}
<div class="bg-gray-800 rounded-lg p-3 flex justify-between items-center gap-3">
    <div class="flex-1 min-w-0">
        {% if item.is_dir %}
        <a class="font-medium hover:text-blue-400 block truncate" href="/?area={{ item.area|urlencode }}&path={{ item.path|urlencode }}">📁 {{ item.name }}</a>
        {% else %}
        <div class="font-medium truncate">📄 {{ item.name }}</div>
        {% endif %}
        <div class="text-xs text-gray-500">{{ item.size_human }}</div>
    </div>
    <div class="flex gap-2">
        {% if not item.is_dir %}
        <button onclick='inspectAudio({{ item.area|tojson }}, {{ item.path|tojson }})' class="bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded text-sm">Audio</button>
        {% endif %}
        <button onclick='openRenameModal({{ item.area|tojson }}, {{ item.path|tojson }}, {{ item.name|tojson }})' class="bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded text-sm">Rename</button>
        <button onclick='openMoveModal({{ item.area|tojson }}, {{ item.path|tojson }}, {{ item.name|tojson }})' class="bg-green-700 hover:bg-green-600 px-2 py-1 rounded text-sm">Move</button>
    </div>
</div>
{% else %}
<div class="text-center py-8 text-gray-500">No items here</div>
{% endfor %}
