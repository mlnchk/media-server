services:
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    env_file: .env
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Asia/Bangkok
      USER: ${USER_NAME}
      PASS: ${USER_PASS}
    volumes:
      - ./application-data/transmission:/config
      - ./scripts:/scripts:ro
      - /media/usb/downloads:/data/downloads
      - /media/usb/movies:/data/movies
      - /media/usb/shows:/data/shows
    ports:
      - "9091:9091"
      - "51413:51413"
      - "51413:51413/udp"
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Asia/Bangkok
    volumes:
      - ./application-data/jellyfin:/config
      - /media/usb:/data
    ports:
      - "8096:8096"
      - "8920:8920"
      - "7359:7359/udp"
      - "1900:1900/udp"
    restart: unless-stopped

  dashboard:
    build: .
    container_name: dashboard
    command: ["uvicorn", "dashboard.main:app", "--host", "0.0.0.0", "--port", "8080"]
    env_file: .env
    depends_on:
      - transmission
    ports:
      - "3000:8080"
    volumes:
      - /media/usb:/data
    restart: unless-stopped

  telegram-bot:
    build: .
    container_name: telegram-bot
    command: ["python", "-m", "bot.main"]
    env_file: .env
    depends_on:
      - transmission
    restart: unless-stopped
